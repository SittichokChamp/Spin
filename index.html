<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>AR Washing Machine - Hiro Marker</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;font-family:Arial,sans-serif;background:#000}
#instruction{
 position:fixed;top:15px;left:50%;transform:translateX(-50%);
 z-index:9999;color:#fff;background:rgba(0,0,0,.7);
 padding:10px 18px;border-radius:20px;font-size:14px;
 text-align:center;white-space:nowrap
}
#controls{
 position:fixed;left:50%;bottom:20px;transform:translateX(-50%);
 z-index:9999;width:min(94%,520px);padding:15px;
 background:rgba(18,18,18,.86);backdrop-filter:blur(10px);
 border-radius:20px;color:#fff;text-align:center;
 box-shadow:0 10px 40px rgba(0,0,0,.45)
}
#controls h2{margin:0 0 12px;font-size:20px}
.speed-buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:9px}
button{
 border:0;border-radius:12px;padding:13px 7px;font-size:15px;
 font-weight:bold;color:#fff;background:#333;cursor:pointer
}
button:active{transform:scale(.96)}
button.active{background:#2196f3;box-shadow:0 0 15px rgba(33,150,243,.65)}
#lidButton{width:100%;background:#4caf50}
#status{margin-top:9px;font-size:14px;opacity:.9}
</style>
</head>

<body>

<div id="instruction">🎯 ส่องกล้องไปที่ Hiro Marker</div>

<div id="controls">
  <h2>🧺 เครื่องซักผ้า AR</h2>

  <div class="speed-buttons">
    <button id="stopBtn" class="active">STOP</button>
    <button id="slowBtn">ช้า</button>
    <button id="mediumBtn">กลาง</button>
    <button id="fastBtn">เร็ว</button>
  </div>

  <button id="lidButton">🚪 เปิดฝาถัง</button>
  <div id="status">ความเร็วถัง: หยุด</div>
</div>

<a-scene
  embedded
  vr-mode-ui="enabled:false"
  renderer="antialias:true; alpha:true; colorManagement:true"
  arjs="sourceType:webcam; debugUIEnabled:false; trackingMethod:best;"
>
  <a-entity light="type:ambient;color:#fff;intensity:1.2"></a-entity>
  <a-entity light="type:directional;color:#fff;intensity:1.5" position="2 4 3"></a-entity>

  <a-marker id="hiroMarker" preset="hiro">

    <a-entity id="washingMachine" position="0 0 0" scale=".7 .7 .7">

      <!-- ตัวเครื่อง -->
      <a-box position="0 1.25 0" width="2" height="2.5" depth="1.5"
             color="#e9edf1"
             material="roughness:.3;metalness:.2"></a-box>

      <!-- แผงควบคุม -->
      <a-box position="0 2.28 -.76" width="1.75" height=".35" depth=".08"
             color="#20252b"></a-box>

      <a-box position=".45 2.30 -.82" width=".35" height=".18" depth=".03"
             color="#00e5ff"></a-box>

      <a-cylinder position="-.45 2.30 -.82" radius=".11" height=".06"
                  rotation="90 0 0" color="#555"></a-cylinder>

      <!-- ขอบประตู -->
      <a-cylinder position="0 1.25 -.80" radius=".67" height=".16"
                  rotation="90 0 0" color="#30343a"></a-cylinder>

      <!-- ฝา/กระจก -->
      <a-cylinder id="door" position="0 1.25 -.90" radius=".57" height=".08"
                  rotation="90 0 0" color="#87c8df"
                  material="opacity:.55;transparent:true;metalness:.4;roughness:.1"></a-cylinder>

      <!-- ถังซัก -->
      <a-entity id="drum" position="0 1.25 -.95" rotation="90 0 0">
        <a-torus radius=".46" radius-tubular=".07" color="#777"></a-torus>

        <a-cylinder radius=".42" height=".08" color="#505860"
                    material="metalness:.5;roughness:.4"></a-cylinder>

        <a-box position="0 0 .06" width=".12" height=".65" depth=".04"
               color="#9aa0a6"></a-box>
        <a-box position="0 0 .07" width=".65" height=".12" depth=".04"
               color="#9aa0a6"></a-box>
      </a-entity>

      <!-- มือจับ -->
      <a-box position="0 1.25 -.98" width=".35" height=".06" depth=".05"
             color="#20252b"></a-box>

      <!-- ขา -->
      <a-cylinder position="-.7 .08 .45" radius=".13" height=".18" color="#333"></a-cylinder>
      <a-cylinder position=".7 .08 .45" radius=".13" height=".18" color="#333"></a-cylinder>
      <a-cylinder position="-.7 .08 -.45" radius=".13" height=".18" color="#333"></a-cylinder>
      <a-cylinder position=".7 .08 -.45" radius=".13" height=".18" color="#333"></a-cylinder>

    </a-entity>
  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
const drum = document.getElementById("drum");
const door = document.getElementById("door");
const status = document.getElementById("status");
const instruction = document.getElementById("instruction");

const stopBtn = document.getElementById("stopBtn");
const slowBtn = document.getElementById("slowBtn");
const mediumBtn = document.getElementById("mediumBtn");
const fastBtn = document.getElementById("fastBtn");
const lidButton = document.getElementById("lidButton");

let rotationSpeed = 0;
let lidOpen = false;

function setSpeed(speed, text, selectedButton) {
  rotationSpeed = speed;

  document.querySelectorAll(".speed-buttons button")
    .forEach(btn => btn.classList.remove("active"));

  selectedButton.classList.add("active");
  status.textContent = "ความเร็วถัง: " + text;
}

stopBtn.onclick = () => setSpeed(0, "หยุด", stopBtn);
slowBtn.onclick = () => setSpeed(.8, "ช้า", slowBtn);
mediumBtn.onclick = () => setSpeed(2.5, "กลาง", mediumBtn);
fastBtn.onclick = () => setSpeed(6, "เร็ว", fastBtn);

function animateDrum() {
  if (rotationSpeed !== 0) {
    const r = drum.getAttribute("rotation");
    r.z += rotationSpeed;
    drum.setAttribute("rotation", r);
  }
  requestAnimationFrame(animateDrum);
}
animateDrum();

lidButton.onclick = () => {
  lidOpen = !lidOpen;

  if (lidOpen) {
    lidButton.textContent = "🚪 ปิดฝาถัง";
    lidButton.style.background = "#f44336";

    door.setAttribute("animation",
      "property:rotation;to:20 0 0;dur:600;easing:easeOutCubic");
  } else {
    lidButton.textContent = "🚪 เปิดฝาถัง";
    lidButton.style.background = "#4caf50";

    door.setAttribute("animation",
      "property:rotation;to:90 0 0;dur:600;easing:easeOutCubic");
  }
};

document.getElementById("hiroMarker").addEventListener("markerFound", () => {
  instruction.textContent = "✅ พบ Hiro Marker — เครื่องซักผ้าพร้อมใช้งาน";
  instruction.style.background = "rgba(0,140,0,.78)";
});

document.getElementById("hiroMarker").addEventListener("markerLost", () => {
  instruction.textContent = "🎯 ส่องกล้องไปที่ Hiro Marker";
  instruction.style.background = "rgba(0,0,0,.7)";
});
</script>

</body>
</html>
